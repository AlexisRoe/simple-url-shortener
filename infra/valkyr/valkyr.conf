# Persistent storage location (mounted as a named volume)
dir /data
dbfilename dump.rdb

# Automatic RDB snapshots:
# save <seconds> <changes> - dump if at least <changes> keys changed in <seconds>
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes

# Bind to all interfaces inside the internal docker network only. No host
# port is published for this service, so it's never reachable from outside
# the internal docker network -- but authentication (see below) is a second,
# independent layer of defense in case that network boundary is ever
# weakened (e.g. a published port or a shared network).
bind 0.0.0.0
protected-mode no

# ACL authentication: the default user is disabled outright, and the only
# usable account is the one defined via `--user` command-line overrides in
# infra/docker-compose.yml (sourced from VALKEY_USERNAME/VALKEY_PASSWORD in
# .env), since this static file can't interpolate environment variables.
