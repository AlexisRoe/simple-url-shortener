# Persistent storage location (mounted as a named volume)
dir /data
dbfilename dump.rdb

# Automatic RDB snapshots:
# save <seconds> <changes> - dump if at least <changes> keys changed in <seconds>
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes

# Bind to all interfaces inside the internal docker network only. Protected
# mode is disabled because this server is never reachable from outside the
# internal docker network (no host port is published for it).
bind 0.0.0.0
protected-mode no
